  :root{
    /* warm black + vanilla — amber phosphor */
    --ink:#0c0a07;
    --ink-2:#100c08;
    --panel:#15100a;
    --panel-2:#181209;
    --edge:#2b2114;
    --vanilla:#f2e6c8;   /* primary text */
    --cream:#fbf3dd;     /* bright highlight */
    --gold:#e6b45c;      /* signature accent */
    --bronze:#c98a3e;    /* deep accent */
    --sage:#b6cf8f;      /* functional "ok/online" only */
    --dim:#a8926a;
    --dim-2:#94825c;
    --glow:0 0 5px rgba(230,180,92,.5), 0 0 20px rgba(230,180,92,.14);
    --bg:radial-gradient(120% 90% at 50% -10%, #191207 0%, #0c0a07 55%, #050402 100%);
    --scan-op:.5;
    --vig:rgba(0,0,0,.5);
    /* --- v1.2 responsive foundation: layout tokens (non-color; JS themes never touch these) --- */
    --maxw:960px;          /* Agent X + footer max width */
    --radius:12px;         /* window corner radius */
    --gap:clamp(10px,2.4vw,13px);
    --pad-body:clamp(8px,3vw,34px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--vanilla);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(13.5px,0.55vw + 13px,15px);line-height:1.55;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap);
    padding:var(--pad-body);
    min-height:100vh;min-height:100dvh;   /* dvh so mobile toolbars don't force extra scroll */
  }
  .foot{width:min(var(--maxw),100%);display:flex;flex-direction:column;align-items:center;
    gap:3px;text-align:center;font-size:11.5px;letter-spacing:.05em;color:var(--dim)}
  .foot .gold{color:var(--gold);text-shadow:none}
  .foot .audit{color:var(--sage)}
  .foot .audit .m{color:var(--dim)}
  .foot .sep{color:var(--dim-2)}
  .foot-row,.foot-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px}
  .foot-meta{font-size:10px;color:var(--dim)}
  .foot .ver{color:var(--dim);font-variant-numeric:tabular-nums}
  .foot-row>span,.foot-meta>span{transition:color .18s ease,text-shadow .18s ease}
  .foot-row>span:not(.sep):hover,.foot-meta>span:not(.sep):hover{color:var(--cream);text-shadow:0 0 7px rgba(230,180,92,.35)}
  .foot-row>span:not(.sep):hover .m{color:var(--sage)}
  .foot-row>span:not(.sep):hover .gold{text-shadow:0 0 8px rgba(230,180,92,.5)}

  .win{
    width:min(var(--maxw),100%);
    flex:1 1 auto;                         /* grow to fill, so footer always stays on-screen */
    min-height:min(440px,70dvh);           /* was fixed 440px -> caused overflow on short/landscape screens */
    max-height:min(78dvh,720px);
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
    border:1px solid var(--edge);border-radius:var(--radius);
    box-shadow:0 0 0 1px rgba(230,180,92,.05),0 30px 80px -20px rgba(0,0,0,.85),0 0 60px -24px rgba(230,180,92,.22);
    overflow:hidden;position:relative;
  }
  .titlebar{
    display:flex;align-items:center;gap:12px;padding:10px 14px;
    background:linear-gradient(180deg,#181109,#120d07);
    border-bottom:1px solid var(--edge);flex:0 0 auto;user-select:none;
  }
  .lights{display:flex;gap:7px}
  .lights i{width:11px;height:11px;border-radius:50%;display:block;opacity:.92}
  .lights i:nth-child(1){background:var(--bronze);box-shadow:0 0 8px var(--bronze)}
  .lights i:nth-child(2){background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .lights i:nth-child(3){background:var(--cream);box-shadow:0 0 8px rgba(251,243,221,.6)}
  .title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title b{color:var(--gold);font-weight:500}
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--dim);flex:0 0 auto}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--sage);
    box-shadow:0 0 8px var(--sage);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .screen{position:relative;flex:1 1 auto;overflow-y:auto;
    padding:18px clamp(14px,3vw,26px) 48px;
    scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
  .screen::-webkit-scrollbar{width:9px}
  .screen::-webkit-scrollbar-thumb{background:var(--edge);border-radius:9px}
  .win::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.14) 2px 3px);
    mix-blend-mode:multiply;opacity:var(--scan-op)}
  .win::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(130% 110% at 50% 40%,transparent 60%,var(--vig) 100%)}

  .line{white-space:pre-wrap;word-break:break-word}
  .out{margin:0 0 2px}
  .muted{color:var(--dim)}
  .gold{color:var(--gold);text-shadow:var(--glow)}
  .bronze{color:var(--bronze)}
  .cream{color:var(--cream)}
  .sage{color:var(--sage)}
  .b{font-weight:700}
  a{color:var(--gold);text-decoration:none;border-bottom:1px dotted rgba(230,180,92,.5)}
  a:hover{color:var(--cream);border-bottom-color:var(--cream)}
  a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}

  .boot .ok{color:var(--sage)}
  .boot .tag{color:var(--dim)}
  .bar{color:var(--gold);letter-spacing:1px}
  .pct{color:var(--dim)}

  .ascii{font-family:"VT323",monospace;font-size:clamp(20px,4.6vw,34px);line-height:.98;
    color:var(--gold);text-shadow:var(--glow);margin:2px 0 6px;white-space:pre;overflow-x:auto}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 18px;margin:4px 0 2px}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0;color:var(--vanilla)}

  .cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:2px 22px;margin:4px 0}
  .cmds div{color:var(--vanilla)}
  .cmds b{color:var(--gold);font-weight:500}

  .proj{margin:5px 0 8px;padding-left:12px;border-left:2px solid var(--edge)}
  .proj .h{color:var(--cream)}
  .proj .m{color:var(--dim);font-size:13px}
  .tagx{display:inline-block;border:1px solid var(--edge);border-radius:3px;padding:0 5px;
    font-size:11px;letter-spacing:.06em;color:var(--gold);margin-left:4px}
  pre.json{margin:4px 0;padding:10px 12px;border:1px solid var(--edge);border-radius:6px;
    background:rgba(0,0,0,.18);color:var(--vanilla);font-size:12.5px;line-height:1.5;
    overflow-x:auto;white-space:pre}

  .inputline{display:flex;align-items:baseline;gap:8px;padding-top:6px;
    flex-wrap:wrap;scroll-margin-bottom:56px}
  .ps1{white-space:nowrap}
  .ps1 .p{color:var(--gold)}
  .ps1 .at{color:var(--dim)}
  .entry{display:inline-flex;align-items:baseline;min-width:0;max-width:100%}
  #cmd{flex:0 1 auto;width:1ch;max-width:100%;min-width:0;background:transparent;border:0;outline:0;
    color:var(--cream);font:inherit;caret-color:transparent;padding:0}
  .cur{display:inline-block;width:.6ch;height:1.08em;transform:translateY(2px);
    background:var(--gold);box-shadow:var(--glow);margin-left:1px;flex:0 0 auto}
  .cur.blink{animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @keyframes bxflick{0%{opacity:0}8%{opacity:.7}12%{opacity:.25}18%{opacity:1}24%{opacity:.5}30%{opacity:1}100%{opacity:1}}
  @keyframes bxglow{0%,100%{text-shadow:0 0 4px rgba(230,180,92,.35),0 0 12px rgba(230,180,92,.12)}50%{text-shadow:0 0 9px rgba(230,180,92,.6),0 0 24px rgba(230,180,92,.25)}}
  .ascii.banner-anim{animation:bxflick .7s steps(1,end) both,bxglow 2.6s ease-in-out .7s infinite;will-change:opacity,text-shadow}
  .ascii.banner-anim:hover{text-shadow:0 0 11px rgba(230,180,92,.75),0 0 30px rgba(230,180,92,.4)}

  .hint{position:absolute;left:0;right:0;bottom:0;z-index:7;display:flex;gap:16px;
    flex-wrap:wrap;justify-content:center;padding:7px 14px;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);background:linear-gradient(0deg,#120d07,transparent);
    pointer-events:none}
  .hint b{color:var(--gold);font-weight:500}

  /* --- Phase 2: tappable command chips (help / ls) — real buttons, keyboard + AT reachable --- */
  .chip{font:inherit;text-align:left;background:transparent;border:0;padding:0;margin:0;
    color:var(--vanilla);cursor:pointer;border-radius:4px;width:100%}
  .chip b{color:var(--gold);font-weight:500}
  .chip:hover,.chip:hover b{color:var(--cream)}
  .chip:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  var HISTORY=[],hIdx=-1;
  function run(raw){
    var line=raw.trim();
    var e=el('<span class="ps1"><span class="p">ai-agent-x-dev</span><span class="at">@edge</span>:<span class="gold">~</span>$</span> '+escapeHtml(raw));

    if(!line){scroll();return;}
    var parts=line.split(/\s+/), name=(parts[0]||"").toLowerCase();
    name=ALIASES[name]||name;
    var fn=C[name];
    if(fn){var html=fn(parts.slice(1));if(html!=null)print(html);if(name==="neofetch")tickUptime();}
    else print('<div class="bronze">x-sh: command not found: '+escapeHtml(parts[0])+'</div>'+
      '<div class="muted">type <span class="gold">help</span> for the list.</div>');

  var START=Date.now()-1000*60*60*7-1000*60*13;

  function tickUptime(){var n=document.getElementById("uptime");if(!n)return;n.textContent=fmtUptime();
    clearInterval(tickUptime._t);tickUptime._t=setInterval(function(){var x=document.getElementById("uptime");
      if(!x){clearInterval(tickUptime._t);return;}x.textContent=fmtUptime();},1000);}

  function startMatrix(){
    if(document.getElementById("mx"))return;
    var win=document.getElementById("win");
    var cv=document.createElement("canvas");cv.id="mx";
    cv.style.cssText="position:absolute;top:0;left:0;width:100%;height:100%;z-index:6;pointer-events:none;opacity:.6";
    win.appendChild(cv);
    var ctx=cv.getContext("2d");
    var W=cv.width=win.clientWidth||win.offsetWidth||800;
    var H=cv.height=win.clientHeight||win.offsetHeight||500;
    var cols=Math.max(1,Math.floor(W/12));
    var drops=[];for(var k=0;k<cols;k++){drops[k]=Math.floor(Math.random()*(H/12));}
    var chars="0123456789ABCDEF01アイウエオカ▚▞░▓".split("");
    var t=setInterval(function(){
      ctx.fillStyle="rgba(12,10,7,.10)";ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#e6b45c";ctx.font="13px monospace";
      for(var i=0;i<cols;i++){
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*12,drops[i]*13);
        if(drops[i]*13>H&&Math.random()>.975)drops[i]=0;drops[i]++;
      }
    },55);
    function stop(){clearInterval(t);cv.remove();window.removeEventListener("keydown",stop,true);screen.removeEventListener("click",stop);}
    setTimeout(function(){window.addEventListener("keydown",stop,true);screen.addEventListener("click",stop);},120);
  }

  function boot(done){
    if(reduce){BOOT.forEach(function(b){print(b.bar?b.h+' <span class="bar">▓▓▓▓▓▓▓▓▓▓▓▓▓▓</span> <span class="pct">100%</span>':b.h);});done();return;}
    var i=0;
    (function next(){
      if(i>=BOOT.length){done();return;}
      var b=BOOT[i++];
      if(b.bar){
        var node=el('<span class="boot">'+b.h+' <span class="bar" data-bar></span> <span class="pct" data-pct>0%</span></span>');
        log.appendChild(node);scroll();
        var barEl=node.querySelector('[data-bar]'),pctEl=node.querySelector('[data-pct]');

        var t=setInterval(function(){
          step++;barEl.textContent=rep('▓',step)+rep('░',total-step);
          pctEl.textContent=Math.round(step/total*100)+'%';
          if(step>=total){clearInterval(t);setTimeout(next,300);}
        },105); // ~1.5s to fill
        return;
      }
      var d=el('<span class="boot">'+b.h+'</span>');log.appendChild(d);scroll();
      setTimeout(next,b.d);

  function sizeInput(){input.style.width=Math.max(1,input.value.length)+"ch";}

  document.getElementById("win").addEventListener("click",function(ev){

  // Phase 2: keep the input line visible above the on-screen keyboard when it opens.

  document.addEventListener("keydown",function(ev){
    if(inputline.hidden)return;

  input.addEventListener("keydown",function(ev){
    if(ev.key==="Enter"){var v=input.value;input.value="";sizeInput();run(v);}

    else if(ev.key==="Tab"){ev.preventDefault();var frag=input.value.trim().toLowerCase();

        var hit=names.filter(function(n){return n.indexOf(frag)===0;});
        if(hit.length===1){input.value=hit[0];sizeInput();}
        else if(hit.length>1){run(input.value);print('<div class="muted">'+hit.join("   ")+'</div>');}}}
    else if(ev.key==="l"&&ev.ctrlKey){ev.preventDefault();C.clear();}});
  function caretEnd(){sizeInput();requestAnimationFrame(function(){input.setSelectionRange(input.value.length,input.value.length);});}

  var _vf=document.getElementById("ver");if(_vf)_vf.textContent="v"+VERSION;
  boot(function(){inputline.hidden=false;sizeInput();focusInput();});
